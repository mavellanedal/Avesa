services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - avesa_pgdata:/var/lib/postgresql/data
    networks: [avesa_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CONSOLE_LOG: ${CONSOLE_LOG}
      LD_DUPLICATE_WITHOUT_ORIGIN_INTERVAL: ${LD_DUPLICATE_WITHOUT_ORIGIN_INTERVAL}
      LD_DUPLICATE_INTERVAL: ${LD_DUPLICATE_INTERVAL}
      LD_DUPLICATE_RESEND_INTERVAL: ${LD_DUPLICATE_RESEND_INTERVAL}
    depends_on:
      db:
        condition: service_healthy
    networks: [avesa_net]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on: [backend]
    networks: [avesa_net]
    restart: unless-stopped

volumes:
  avesa_pgdata:

networks:
  avesa_net:
    driver: bridge
