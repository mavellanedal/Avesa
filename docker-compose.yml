services:
  db:
    image: postgres:16-alpine
    container_name: avesa_db
    env_file:
      - ./backend/.env.${NODE_ENV:-development}
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - avesa_pgdata:/var/lib/postgresql/data
    networks: [avesa_net]
    healthcheck:
      # Modificado el healthcheck para usar las variables correctas del .env
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: avesa_backend
    env_file:
      - ./backend/.env.${NODE_ENV:-development}
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT}
      DB_HOST: db
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks: [avesa_net]
    command: npm run start:dev

  frontend:
    build: ./frontend
    container_name: avesa_frontend
    ports:
      - "${FRONTEND_PORT}:4200"
    depends_on: [backend]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks: [avesa_net]
    command: npm run start -- --host 0.0.0.0 --port 4200 --poll 2000

volumes:
  avesa_pgdata:

networks:
  avesa_net:
    driver: bridge
