services:
  db:
    image: postgres:16-alpine
    container_name: avesa_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - avesa_pgdata:/var/lib/postgresql/data
    networks: [avesa_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: avesa_backend
    environment:
      NODE_ENV: development
      PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks: [avesa_net]
    command: npm run start:dev

  frontend:
    build: ./frontend
    container_name: avesa_frontend
    ports:
      - "${FRONTEND_PORT}:4200"
    depends_on: [backend]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks: [avesa_net]
    command: npm run start -- --host 0.0.0.0 --port 4200 --poll 2000

volumes:
  avesa_pgdata:

networks:
  avesa_net:
    driver: bridge
