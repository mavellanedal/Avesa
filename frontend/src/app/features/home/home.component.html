<div class="layout">

  <!-- Sidebar -->
  <aside
    class="sidebar"
    [class.sidebar--expanded]="!isCollapsed()"
    [class.sidebar--collapsed]="isCollapsed()"
  >
    <div
      class="sidebar-header"
      [class.sidebar-header--expanded]="!isCollapsed()"
      [class.sidebar-header--collapsed]="isCollapsed()"
    >
      @if (!isCollapsed()) {
        <img src="assets/images/LogotipoBlanco.webp" alt="Avesa Proptech" class="sidebar-logo-full">
      } @else {
        <img src="assets/images/IsotipoBlanco.svg" alt="Avesa Proptech" class="sidebar-logo-icon">
      }

      <button (click)="toggleSidebar()" class="sidebar-toggle">
        <mat-icon>{{ isCollapsed() ? 'left_panel_open' : 'left_panel_close' }}</mat-icon>
      </button>
    </div>

    <nav class="sidebar-nav" [class.sidebar-nav--padded]="!isCollapsed()">
      @for (item of menuItems; track item.label) {
        @if (item.visible) {
          <a
            [routerLink]="item.route"
            routerLinkActive="nav-item--active"
            [routerLinkActiveOptions]="{exact: true}"
            class="nav-item"
            [class.nav-item--padded]="!isCollapsed()"
            [class.nav-item--centered]="isCollapsed()"
          >
            <mat-icon class="nav-icon" [class.nav-icon--spaced]="!isCollapsed()">
              {{ item.icon }}
            </mat-icon>
            @if (!isCollapsed()) {
              <span class="nav-label">{{ item.label | transloco }}</span>
            }
          </a>
        }
      }
    </nav>

    <div class="sidebar-footer">
      <button (click)="logout()" class="logout-btn">
        <mat-icon class="logout-icon" [class.logout-icon--spaced]="!isCollapsed()">logout</mat-icon>
        @if (!isCollapsed()) {
          <span class="logout-label">{{ 'home.logout' | transloco }}</span>
        }
      </button>
    </div>
  </aside>

  <!-- Main panel -->
  <div class="main-panel">
    <div class="content-area">

      <!-- Header flotante top-right, sobre el tab-group de cada hijo -->
      <div class="header">
        <button mat-icon-button color="accent" class="notification-btn" aria-label="Notificaciones">
          <mat-icon>notifications</mat-icon>
          <span class="notification-dot"></span>
        </button>

        <button mat-button [matMenuTriggerFor]="userMenu" color="accent" class="user-btn">
          <mat-icon class="user-icon">account_circle</mat-icon>
          @if (user) {
            <div class="user-info">
              <small>{{ user.groups[0] }}</small>
              <strong>{{ user.name ? user.name + ' ' + user.surname : user.username }}</strong>
            </div>
          }
        </button>
        <mat-menu #userMenu="matMenu"></mat-menu>
      </div>

      <router-outlet />
    </div>
  </div>
</div>
