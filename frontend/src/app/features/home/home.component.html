<div class="layout">

  <!-- Sidebar -->
  <aside
    [class.w-64]="!isCollapsed()"
    [class.w-20]="isCollapsed()"
    class="bg-primary text-white flex flex-col shrink-0 transition-all duration-300"
  >
    <div
      class="flex items-center transition-all duration-300"
      [class.flex-row]="!isCollapsed()" [class.h-16]="!isCollapsed()" [class.px-6]="!isCollapsed()" [class.justify-between]="!isCollapsed()"
      [class.flex-col]="isCollapsed()" [class.py-6]="isCollapsed()" [class.gap-6]="isCollapsed()" [class.justify-center]="isCollapsed()"
    >
      @if (!isCollapsed()) {
        <img src="assets/icons/LogotipoBlanco.webp" alt="Avesa Proptech" class="h-20">
      } @else {
        <img src="assets/icons/IsotipoBlanco.svg" alt="Avesa Proptech" class="h-10">
      }

      <button (click)="toggleSidebar()" class="text-gray-300 hover:text-white transition-colors">
        <mat-icon>{{ isCollapsed() ? 'left_panel_open' : 'left_panel_close' }}</mat-icon>
      </button>
    </div>

    <nav class="flex-1 py-6 space-y-2 overflow-x-hidden overflow-y-hidden font-medium" [class.px-2]="!isCollapsed()">
      @for (item of menuItems; track item.label) {
        @if (item.visible) {
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-gradient-to-r from-[#0A2342] from-0% to-[#12365A] to-[10%] !text-focus !border-focus"
            [routerLinkActiveOptions]="{exact: true}"
            class="flex items-center py-3 text-white text-xl border-l-4 border-transparent hover:bg-hover! hover:bg-none! hover:border-transparent! hover:text-white! transition-all group"
            [class.px-4]="!isCollapsed()" [class.justify-center]="isCollapsed()"
          >
            <mat-icon class="group-hover:scale-110 transition-transform" [class.mr-3]="!isCollapsed()">
              {{ item.icon }}
            </mat-icon>
            @if (!isCollapsed()) {
              <span class="font-medium whitespace-nowrap">{{ item.label | transloco }}</span>
            }
          </a>
        }
      }
    </nav>

    <div class="p-4">
      <button
        (click)="logout()"
        class="flex items-center w-full py-3 text-gray-300 hover:bg-hover! rounded-lg transition-colors text-xl overflow-hidden group"
      >
        <mat-icon class="logout-icon" [class.mr-3]="!isCollapsed()">logout</mat-icon>
        @if (!isCollapsed()) {
          <span class="font-medium">{{ 'home.logout' | transloco }}</span>
        }
      </button>
    </div>
  </aside>

  <!-- Main panel -->
  <div class="main-panel">
    <div class="content-area">

      <!-- Header flotante top-right, sobre el tab-group de cada hijo -->
      <div class="header">
        <button mat-icon-button color="accent" class="notification-btn" aria-label="Notificaciones">
          <mat-icon>notifications</mat-icon>
          <span class="notification-dot"></span>
        </button>

        <button mat-button [matMenuTriggerFor]="userMenu" color="accent" class="user-btn">
          <mat-icon class="user-icon">account_circle</mat-icon>
          @if (user) {
            <div class="user-info">
              <small>{{ user.groups[0] }}</small>
              <strong>{{ user.name ? user.name + ' ' + user.surname : user.username }}</strong>
            </div>
          }
        </button>
        <mat-menu #userMenu="matMenu"></mat-menu>
      </div>

      <router-outlet />
    </div>
  </div>
</div>
