<h2 mat-dialog-title class="mbottom0">
  <mat-icon>info</mat-icon>
  {{'propertyTracking.info-property' | transloco: { value: data.property.propertyCode } }}
</h2>

<mat-dialog-content>
  <div class="mat-elevation-z1 mtop10">
    <table mat-table [dataSource]="rows" class="w100">

      <ng-container matColumnDef="label">
        <td mat-cell *matCellDef="let row" class="label-cell">{{row.label}}</td>
      </ng-container>

      <ng-container matColumnDef="value">
        <td mat-cell *matCellDef="let row">{{row.value}}</td>
      </ng-container>

      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell noData" colspan="2">{{'no-data' | transloco}}</td>
      </tr>
    </table>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="primary" mat-dialog-close>{{'ok' | transloco}}</button>
</mat-dialog-actions>
