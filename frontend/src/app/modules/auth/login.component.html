<div class="min-h-screen flex items-center justify-center bg-primary px-4">
  <div class="bg-surface p-8 rounded-lg shadow-2xl w-full max-w-100">
    <div class="flex flex-col items-center mb-10">
      <img src="LogotipoAzul.webp" alt="Logotipo de Avesa Proptech" class="h-50 mb-4">
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Username -->
      <div>
        <div class="relative">
          <input
            type="text"
            id="username"
            formControlName="username"
            placeholder=" "
            [ngClass]="loginForm.get('username')?.touched && loginForm.get('username')?.hasError('required')
              ? 'border-danger focus:border-danger'
              : 'border-gray-200 focus:border-secondary'"
            class="block px-2.5 pb-2.5 pt-4 w-full text-sm text-gray-900 bg-transparent rounded-lg border appearance-none focus:outline-none focus:ring-0 peer" />
          <label
            for="username"
            [ngClass]="loginForm.get('username')?.touched && loginForm.get('username')?.hasError('required')
              ? 'text-danger'
              : 'text-gray-400 peer-focus:text-primary'"
            class="inline-flex items-center absolute text-sm bg-surface duration-300 transform -translate-y-4 scale-75 top-2 z-10 origin-left px-2 peer-focus:px-2 peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 start-1">
            <span class="material-symbols-rounded me-1.5">account_circle</span>
            Usuario @if (loginForm.get('username')?.hasError('required')) { * }
          </label>
        </div>
        @if (loginForm.get('username')?.touched && loginForm.get('username')?.hasError('required')) {
          <p class="mt-2 text-xs text-danger"><span class="font-medium">Este campo</span> es obligatorio.</p>
        }
      </div>

      <!-- Password -->
      <div>
        <div class="relative">
          <input
            type="password"
            id="password"
            formControlName="password"
            placeholder=" "
            [ngClass]="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')
              ? 'border-danger focus:border-danger'
              : 'border-gray-200 focus:border-secondary'"
            class="block px-2.5 pb-2.5 pt-4 w-full text-sm text-gray-900 bg-transparent rounded-lg border appearance-none focus:outline-none focus:ring-0 peer" />
          <label
            for="password"
            [ngClass]="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')
              ? 'text-danger'
              : 'text-gray-400 peer-focus:text-primary'"
            class="inline-flex items-center absolute text-sm bg-surface duration-300 transform -translate-y-4 scale-75 top-2 z-10 origin-left px-2 peer-focus:px-2 peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 start-1">
            <span class="material-symbols-rounded me-1.5">lock</span>
            Contraseña @if (loginForm.get('password')?.hasError('required')) { * }
          </label>
        </div>
        @if (loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')) {
          <p class="mt-2 text-xs text-danger"><span class="font-medium">Este campo</span> es obligatorio.</p>
        }
      </div>

      @if (errorMessage()) {
        <p class="text-sm text-danger text-center">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full text-white bg-primary box-border border border-transparent hover:bg-secondary focus:ring-4 focus:ring-secondary shadow-sm font-medium leading-5 rounded-full text-sm px-4 py-2.5 focus:outline-none disabled:opacity-60 disabled:cursor-not-allowed transition-colors duration-200">
        @if (isLoading()) {
          <svg aria-hidden="true" class="inline w-5 h-5 text-gray-300 animate-spin fill-surface" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/><path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/></svg>
          Iniciando sesión...
        } @else {
          Iniciar Sesión
        }
      </button>
    </form>
  </div>
</div>
